name: CI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. The repository default is already
# read-only, but declaring it here keeps the workflow correct if that default
# ever changes, and is what CodeQL's actions/missing-workflow-permissions asks
# for. This workflow only checks out and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install actual type-checker CLIs
        run: |
          npm install --global pyright typescript
          pyright --version
          tsc --version

      # The secret scanner is a Go binary, so pip cannot bring it in with the
      # dev extras.  Same pinned release and same checksum as
      # docker/Dockerfile.base: if the artifact ever changes under the tag,
      # this step fails instead of silently installing something else.
      # Without it, tests/test_secret_scan.py::TestRealGitleaks skips and the
      # only end-to-end coverage of the publish guard disappears quietly.
      - name: Install gitleaks (secret scanner)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # uv itself, at the same pinned version and by the same installer as
      # docker/Dockerfile.base.  tests/test_uv_workspace_root.py builds real
      # uv workspaces and runs real `uv lock` / `uv sync` / `uv workspace dir`;
      # without uv on PATH those tests fail (they deliberately do not skip, so
      # the real-uv coverage cannot disappear quietly).
      - name: Install uv
        env:
          UV_VERSION: "0.13.1"
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | env UV_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Lint (ruff)
        run: ruff check .

      - name: Check patch targets (issue #166)
        run: |
          python scripts/check_patch_targets.py tests

      - name: Run tests
        run: |
          python -m pytest -v
